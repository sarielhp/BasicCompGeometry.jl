name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        julia-version: ['1.9', '1.10', '1']
        include:
          - os: macos-latest
            julia-version: '1'
          - os: windows-latest
            julia-version: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run package tests
        uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.julia-version == '1' }}
      - name: Process coverage
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        uses: julia-actions/julia-processcoverage@v1
      - name: Save coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      - name: Verify the core installs without visualization packages
        run: |
          julia -e '
            using Pkg
            Pkg.activate(mktempdir())
            Pkg.develop(path=pwd())
            Pkg.instantiate()
            installed = Set(pkg.name for pkg in values(Pkg.dependencies()))
            @assert isempty(intersect(installed, Set(["Cairo", "Colors", "LaTeXStrings"])))
            using BasicCompGeometry
            @assert isnothing(Base.get_extension(BasicCompGeometry, :CairoExt))
            @assert BasicCompGeometry.dist(point(0.0, 0.0), point(3.0, 4.0)) == 5.0'

  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: true

  external-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install figure-generation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ipe poppler-utils qpdf texlive-latex-extra texlive-luatex
      - name: Run tests with LaTeX and Ipe integration
        env:
          BCG_TEST_EXTERNAL_TOOLS: 'true'
          IPELATEXDIR: ${{ runner.temp }}/ipe-latex
          TEXMFCACHE: ${{ runner.temp }}/texmf-cache
          TEXMFVAR: ${{ runner.temp }}/texmf-var
        run: |
          mkdir -p "$IPELATEXDIR" "$TEXMFCACHE" "$TEXMFVAR"
          julia --project=. -e 'using Pkg; Pkg.test()'

  build:
    needs: [test, external-tools]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      statuses: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed for deploydocs
        run: julia --project=docs docs/make.jl
